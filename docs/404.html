<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found | Bashuai Aluminium & Glass Works</title>
  <script>
    // GitHub Pages SPA redirect
    var pathSegmentsToKeep = 1;
    var l = window.location;
    // Redirect to home page with query param or hash if applicable
    window.location.replace(
      l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
      l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=' +
      encodeURIComponent(l.pathname.slice(1)) +
      (l.search ? '&q=' + encodeURIComponent(l.search.slice(1)) : '') +
      l.hash
    );
  </script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      background-color: #0c0f14;
      color: #f1f5f9;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 20px;
    }
    .badge {
      display: inline-block;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      background: rgba(253, 166, 58, 0.15);
      color: #fda63a;
      border: 1px solid rgba(253, 166, 58, 0.3);
      border-radius: 4px;
      margin-bottom: 20px;
    }
    h1 {
      font-size: 28px;
      margin: 0 0 12px;
      font-weight: 700;
    }
    p {
      color: #94a3b8;
      font-size: 15px;
      max-width: 480px;
      line-height: 1.6;
      margin: 0 0 24px;
    }
    a {
      display: inline-flex;
      align-items: center;
      background-color: #fda63a;
      color: #0c0f14;
      font-weight: 700;
      font-size: 14px;
      padding: 12px 24px;
      border-radius: 6px;
      text-decoration: none;
      transition: background 0.2s ease;
    }
    a:hover {
      background-color: #e59530;
    }
  </style>
</head>
<body>
  <div class="badge">Bashuai Fabrication</div>
  <h1>Redirecting to Homepage...</h1>
  <p>The requested architectural page is being relocated. If you are not redirected automatically within a few seconds, click the button below.</p>
  <a href="./">Return to Main Site</a>
</body>
</html>
